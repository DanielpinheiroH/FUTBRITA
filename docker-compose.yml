services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: futbrita
      POSTGRES_USER: futbrita
      POSTGRES_PASSWORD: futbrita
    ports:
      - "5433:5432"
    volumes:
      - futbrita_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futbrita -d futbrita"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  futbrita_postgres:
